name: Deploy

on:
  push:
    branches: [master] # или master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NUXT_APP_BASE_URL: '/'
          NUXT_API_BASE_URL: ${{ secrets.NUXT_API_BASE_URL }}
          NUXT_AUTH_URL: ${{ secrets.NUXT_AUTH_URL }}
          NUXT_ASSEMBLIES_EVENTS_URL: ${{ secrets.NUXT_ASSEMBLIES_EVENTS_URL }}
        run: npm run generate

      - name: Disable Jekyll
        run: touch .output/public/.nojekyll

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
